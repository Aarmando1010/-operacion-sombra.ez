<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#080b10">
    <title>Operación Sombra 3D</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; touch-action: none; }
        
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* UI Layers */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        /* Menú Principal */
        #main-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(8, 11, 16, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; pointer-events: auto; }
        h1 { color: #fff; font-size: 8vw; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255,255,255,0.5); text-align: center; }
        h2 { color: #8a9ba8; font-size: 3vw; margin-bottom: 30px; font-weight: normal; }
        .btn-play { background: #dce2e5; color: #0b0f11; border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 5px; cursor: pointer; text-transform: uppercase; }
        .btn-play:active { background: #aeb9bf; }

        /* HUD */
        #hud { position: absolute; top: max(15px, env(safe-area-inset-top)); left: max(15px, env(safe-area-inset-left)); color: #fff; text-shadow: 1px 1px 2px #000; display: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); display: none; pointer-events: none; }
        #damage-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 50%, rgba(255,0,0,0.4) 100%); opacity: 0; transition: opacity 0.2s; pointer-events: none; }

        /* Controles Móviles */
        #mobile-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
        
        #joystick-zone { position: absolute; bottom: 10%; left: max(5%, env(safe-area-inset-left)); width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; touch-action: none; }
        #joystick-knob { position: absolute; top: 50px; left: 50px; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(0px, 0px); pointer-events: none; }
        
        #look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; touch-action: none; }
        
        #btn-fire { position: absolute; bottom: 20%; right: max(15%, env(safe-area-inset-right)); width: 80px; height: 80px; background: rgba(200, 50, 50, 0.6); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; color: white; font-weight: bold; pointer-events: auto; touch-action: none; display: flex; justify-content: center; align-items: center; }
        
        /* Diagnóstico */
        #debug { position: absolute; bottom: 5px; left: 5px; color: #0f0; font-size: 10px; pointer-events: none; z-index: 100; max-height: 100px; overflow-y: auto; width: 90%; text-shadow: 1px 1px 1px #000; }
    </style>
</head>
<body>

    <div id="game-container"></div>
    <div id="damage-overlay"></div>

    <div id="ui-layer">
        <div id="main-menu">
            <h1>OPERACIÓN SOMBRA</h1>
            <h2>VERSIÓN 3D TÁCTICA</h2>
            <button class="btn-play" id="btn-start">Iniciar Misión</button>
        </div>

        <div id="hud">
            <div>SALUD: <span id="hud-hp">100</span></div>
            <div>OLEADA: <span id="hud-wave">1</span></div>
            <div>BAJAS: <span id="hud-kills">0</span></div>
        </div>
        
        <div id="crosshair"></div>

        <div id="mobile-controls">
            <div id="joystick-zone"><div id="joystick-knob"></div></div>
            <div id="look-zone"></div>
            <div id="btn-fire">FUEGO</div>
        </div>
    </div>

    <div id="debug"></div>

    <!-- Sistema de Diagnóstico Temprano -->
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            document.getElementById('debug').innerHTML += `ERROR: ${msg} (${lineNo}:${columnNo})<br>`;
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            document.getElementById('debug').innerHTML += `PROMISE ERROR: ${event.reason}<br>`;
        });
    </script>

    <!-- Three.js CDN (Estable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Lógica del Juego -->
    <script src="./js/game.js"></script>

    <!-- Service Worker PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('SW Falló (Normal en modo privado/local): ', err);
                });
            });
        }
    </script>
</body>
</html>
